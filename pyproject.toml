[project]
name = "clipper"
version = "0.1.0"
description = "Semi-automatic stream clipping: find moments from live chat, audio and video, caption them, review, render vertical clips."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["twitch", "clips", "shorts", "ffmpeg", "whisper", "captions", "streaming", "video-editing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=2.10.0",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "opencv-python-headless>=5.1.0.95",
    "pyyaml>=6.0.2",
    "soundfile>=0.14.0",
    "yt-dlp[default]>=2026.10.26",
]

[project.optional-dependencies]
# NVIDIA's libraries for speech-to-text on an NVIDIA card (about 1 GB). Installed by: setup.ps1 -Gpu
# cuDNN is pinned to the version of the cudnn64_9.dll that ctranslate2 ships; its parts must match exactly.
gpu = [
    "nvidia-cublas-cu12==12.4.5.8; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.10.2.21; sys_platform == 'win32'",
]

[project.scripts]
clipper = "clipper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
